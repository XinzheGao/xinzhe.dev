name: Translate published Notion content
run-name: "${{ inputs.scan_all && '检查全部已发布内容' || (github.event_name != 'workflow_dispatch' && '自动翻译检查') || format('翻译 {0} · {1}', inputs.kind || 'posts', inputs.slug || vars.FIRST_TRANSLATION_SLUG) }}"
on:
  workflow_dispatch:
    inputs:
      scan_all:
        description: Check all published content for missing or changed translations
        type: boolean
        default: false
      slug:
        description: Single article slug (empty uses the configured pilot)
        type: string
      kind:
        description: Content type
        type: choice
        options: [posts, pages, projects, thoughts, journey]
        default: posts
      dry_run:
        description: Validate Notion access without calling the model or publishing
        type: boolean
        default: false
      locale:
        description: Target language (empty means both)
        type: string
  repository_dispatch:
    types: [notion-content-published]
  schedule:
    # Hourly wake-up; automation.json selects hourly / Shanghai 03:00 daily / Monday 03:00.
    - cron: '0 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: notion-translations
  cancel-in-progress: false
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
      # Built-in Node APIs only. A complete scan keeps one store lock across all content kinds.
      - name: Generate translations
        id: generate
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL }}
          TRANSLATION_BASE_URL: ${{ vars.TRANSLATION_BASE_URL }}
          NOTION_POSTS_DATA_SOURCE_ID: ${{ vars.NOTION_POSTS_DATA_SOURCE_ID }}
          NOTION_PAGES_DATA_SOURCE_ID: ${{ vars.NOTION_PAGES_DATA_SOURCE_ID }}
          NOTION_PROJECTS_DATA_SOURCE_ID: ${{ vars.NOTION_PROJECTS_DATA_SOURCE_ID }}
          NOTION_JOURNEY_DATA_SOURCE_ID: ${{ vars.NOTION_JOURNEY_DATA_SOURCE_ID }}
          NOTION_THOUGHTS_DATA_SOURCE_ID: ${{ vars.NOTION_THOUGHTS_DATA_SOURCE_ID }}
          PILOT_SLUG: ${{ inputs.slug || vars.FIRST_TRANSLATION_SLUG }}
          CONTENT_KIND: ${{ inputs.kind }}
          TARGET_LOCALE: ${{ inputs.locale }}
          DRY_RUN: ${{ inputs.dry_run }}
          SCAN_ALL: ${{ inputs.scan_all }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_TOKEN: ${{ github.token }}
          TRANSLATION_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$SCAN_ALL" = true ]; then
            if [ "$DRY_RUN" = true ]; then echo 'scan_all and dry_run cannot be combined'; exit 1; fi
            node scripts/check-translations.mjs
          elif [ "$EVENT_NAME" != workflow_dispatch ]; then
            node scripts/check-translations.mjs --scheduled
          else
            : "${PILOT_SLUG:?Set FIRST_TRANSLATION_SLUG or dispatch with a slug}"
            args=(--kind "${CONTENT_KIND:-posts}" --slug "$PILOT_SLUG")
            if [ -n "$TARGET_LOCALE" ]; then args+=(--locale "$TARGET_LOCALE"); fi
            if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
            node scripts/translate.mjs "${args[@]}"
          fi
      - name: Record check result without a Git commit
        if: always() && steps.generate.outputs.executed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: translation-check-${{ steps.generate.outputs.check_status }}-${{ steps.generate.outputs.check_id }}
          path: translations/.admin-check.json
          include-hidden-files: true
          retention-days: 90
      - name: Persist translation changes and checkpoints
        id: persist
        if: always() && inputs.dry_run != true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          node scripts/translation-publish-state.mjs >> "$GITHUB_OUTPUT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add translations/catalog.json translations/jobs.json translations/verification.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update generated translations and job state'
            # Reconcile disjoint settings changes, fail on real translation conflicts; never force-push.
            git pull --rebase origin "$DEFAULT_BRANCH"
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Preserve state if commit or push fails
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: translation-checkpoints-${{ github.run_id }}
          path: translations/*.json
          retention-days: 7
      - name: Deploy changed published translations
        # Complete successful translations may be deployed even when another document failed.
        if: always() && steps.persist.outcome == 'success' && steps.persist.outputs.published_changed == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOOK:?Configure a Vercel Deploy Hook for the default branch}"
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK" >/dev/null
